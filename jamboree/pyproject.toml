[project]
name = "jamboree"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "keyring>=24.2,<26",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "paramiko>=3.4,<5",
  "pytesseract>=0.3.10,<1",
  "pyserial>=3.5,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
