name: verify
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install flask keyring paramiko pyserial requests pytest
      - run: python -m compileall -q jamboree
      - run: PYTHONPATH=. pytest -q
