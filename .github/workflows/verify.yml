name: diagnose-integration-payload
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/jamboreelite-transport-hardening-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/jamboreelite-transport-hardening-20260804
          fetch-depth: 0
      - name: Print staged chunk and archive checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .agent_payload/chunk*
          cat .agent_payload/chunk* | base64 -d > /tmp/payload.tar.gz
          sha256sum /tmp/payload.tar.gz
          file /tmp/payload.tar.gz
