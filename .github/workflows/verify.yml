name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: >-
          python -m pip install
          flask keyring keyrings.alt numpy opencv-python-headless
          paramiko Pillow pytesseract pyserial requests pytest

      - name: Compile source
        run: python -m compileall -q jamboree tests

      - name: Run regression suite with isolated keyring
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keyring"
          PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring \
          XDG_DATA_HOME="$RUNNER_TEMP/keyring" \
          PYTHONPATH=. pytest -q

      - name: Verify DART reset duration type
        shell: bash
        run: |
          grep -q 'resetRemote(remoteNum, 80);' DART_16Remotes_Buffered_Handshake_TxAck_Timestamps/DART_16Remotes_Buffered_Handshake_TxAck_Timestamps.ino
          ! grep -q 'resetRemote(remoteNum, "80");' DART_16Remotes_Buffered_Handshake_TxAck_Timestamps/DART_16Remotes_Buffered_Handshake_TxAck_Timestamps.ino

      - name: Verify no credential literals
        shell: bash
        run: |
          ! grep -RInE 'passwd\s*[=:]\s*["'"'][^"'"']+|password\s*[=:]\s*["'"'][^"'"']+' jamboree tests

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install from checked-out source tree
        shell: cmd
        run: |
          set "JAMBOREE_INSTALL_DIR=%RUNNER_TEMP%\JAMboreeLite"
          set "JAMBOREE_SKIP_SHORTCUTS=1"
          set "JAMBOREE_NO_PAUSE=1"
          call install_jamboreeLite.cmd
          if errorlevel 1 exit /b 1

      - name: Verify installed application
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\JAMboreeLite"
          "%RUNNER_TEMP%\JAMboreeLite\venv\Scripts\python.exe" -c "import jamboree.app; print('Windows installer smoke test passed')"
