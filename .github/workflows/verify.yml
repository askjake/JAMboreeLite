name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: >-
          python -m pip install
          flask keyring keyrings.alt numpy opencv-python-headless
          paramiko Pillow pytesseract pyserial requests pytest

      - name: Compile source
        run: python -m compileall -q jamboree tests

      - name: Validate shell installers
        shell: bash
        run: |
          bash -n install_jamboreeLite.sh
          bash -n install_jamboreeLite_debian.sh
          bash -n update_jamboreeLite.sh

      - name: Verify installer dependency manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('requirements_new.txt').read_text(encoding='utf-8')
          required = {
              'flask', 'keyring', 'numpy', 'opencv-python-headless', 'paramiko',
              'Pillow', 'pytesseract', 'pyserial', 'requests',
          }
          missing = sorted(name for name in required if name.lower() not in manifest.lower())
          if missing:
              raise SystemExit('requirements_new.txt missing: ' + ', '.join(missing))
          for installer in ('install_jamboreeLite.cmd', 'install_jamboreeLite.sh'):
              text = Path(installer).read_text(encoding='utf-8')
              if 'requirements_new.txt' not in text:
                  raise SystemExit(f'{installer} does not consume requirements_new.txt')
          print('Installer dependency manifest alignment passed')
          PY

      - name: Run regression suite with isolated keyring
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/keyring"
          PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring \
          XDG_DATA_HOME="$RUNNER_TEMP/keyring" \
          PYTHONPATH=. pytest -q

      - name: Verify DART reset duration type
        shell: bash
        run: |
          grep -q 'resetRemote(remoteNum, 80);' DART_16Remotes_Buffered_Handshake_TxAck_Timestamps/DART_16Remotes_Buffered_Handshake_TxAck_Timestamps.ino
          ! grep -q 'resetRemote(remoteNum, "80");' DART_16Remotes_Buffered_Handshake_TxAck_Timestamps/DART_16Remotes_Buffered_Handshake_TxAck_Timestamps.ino

      - name: Verify no credential literals in runtime source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'''(?ix)\b(?:passwd|password)\s*[=:]\s*["'][^"']{4,}["']'''
          )
          violations = []
          for path in Path('jamboree').rglob('*.py'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      violations.append(f'{path}:{number}:{line.strip()}')
          if violations:
              raise SystemExit('credential-like literals found:\n' + '\n'.join(violations))
          print('No credential literals found in runtime source')
          PY

  windows-installer-archive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and update from exact GitHub source
        shell: pwsh
        env:
          ARCHIVE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./tests/windows_installer_archive_test.ps1
          -Repository '${{ github.repository }}'
          -CommitSha $env:ARCHIVE_SHA
